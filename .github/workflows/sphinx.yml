name: Build and publish course documentation

# Triggers on push to gh-pages (where source lives) and supports manual runs.
# Builds the Sphinx HTML tree and commits the output back to gh-pages.
# [skip ci] in the auto-commit message prevents a trigger loop.

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-publish-cdp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install "Sphinx>=7.0" "sphinx-rtd-theme>=2.0"
          pip download "sphinxcontrib-gist>=0.0.6" --no-deps -d /tmp/gist-dl
          cd /tmp && tar xzf gist-dl/sphinxcontrib.gist-*.tar.gz
          sed -i '/declare_namespace/d' sphinxcontrib.gist-*/sphinxcontrib/__init__.py
          pip install --no-build-isolation sphinxcontrib.gist-*/

      - name: Build HTML
        run: sphinx-build -b html docs/source .

      - name: Commit and push built output
        run: |
          git config user.email "lgreco@gmail.com"
          git config user.name "Leo Irakliotis"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto deployment [skip ci]"
            git push
          fi
