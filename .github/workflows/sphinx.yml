#
# Action to build and publish Leo's Course Documentation Project.
# Triggers on push to gh-pages, builds the Sphinx HTML tree,
# and commits the output back to gh-pages.
# [skip ci] in the auto-deploy commit message prevents a trigger loop.
#
# Leo Irakliotis - lgreco@gmail.com
#

on:
    push:
        branches: [gh-pages]

jobs:
    build-and-publish-cdp:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                ref: gh-pages
            - uses: actions/setup-python@v5
              with:
                python-version: '3.x'
                cache: 'pip'
            - run: git config --global user.email "lgreco@gmail.com"
            - run: git config --global user.name "Leo Irakliotis"
            - run: pip install -r requirements.txt
            - run: sphinx-build -b html docs/source .
            - run: git add .
            - run: git diff --staged --quiet || (git commit -m "Auto deployment [skip ci]" && git push)
